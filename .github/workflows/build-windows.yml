name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate temporary signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tauri | Out-Null
          .\apps\desktop\node_modules\.bin\tauri.cmd signer generate --ci --write-keys ".tauri\cursor-byok.local.key"
          "TAURI_SIGNING_PRIVATE_KEY=$((Resolve-Path '.tauri\cursor-byok.local.key').Path)" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV

      - name: Build Windows
        working-directory: apps/desktop
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-windows-latest
          path: |
            target/release/bundle/nsis/*.exe
            target/release/cursor-byok-desktop.exe
